<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta de Produtos</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h2 class="text-center mb-4">Consulta de Produtos</h2>

    <!-- Mensagem de sucesso ou erro -->
    <div id="message" class="alert" role="alert" style="display: none;"></div>

    <!-- Tabela de produtos -->
    <table class="table table-striped table-bordered table-responsive">
      <thead>
        <tr>
          <th>ID</th>
          <th>Tipo</th>
          <th>Marca</th>
          <th>Tamanho</th>
          <th>Quantidade</th>
          <th>Preço</th>
          <th>Valor Total</th>
        </tr>
      </thead>
      <tbody id="product-table-body">
        <!-- Dados serão inseridos aqui via JavaScript -->
      </tbody>
    </table>

    <!-- Mensagem quando não há produtos -->
    <div id="no-products-message" class="alert alert-warning" style="display: none;">
      Nenhum produto encontrado.
    </div>
  </div>

  <!-- Bootstrap 5 JS (com dependência Popper.js) -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
  
  <script>
    // Função para consultar os produtos
    async function fetchProducts() {
      try {
        const response = await fetch('http://localhost:8080/roupas');
        const products = await response.json();

        // Limpar mensagens anteriores
        document.getElementById('message').style.display = 'none';
        document.getElementById('no-products-message').style.display = 'none';
        document.getElementById('product-table-body').innerHTML = '';

        if (products.length === 0) {
          document.getElementById('no-products-message').style.display = 'block';
          return;
        }

        // Preencher a tabela com os produtos
        products.forEach(product => {
          const row = document.createElement('tr');

          // Calcular o valor total
          const totalValue = (product.quantidade * product.preco).toFixed(2);

          row.innerHTML = `
            <td>${product.id}</td>
            <td>${product.tipo}</td>
            <td>${product.marca}</td>
            <td>${product.tamanho}</td>
            <td>${product.quantidade}</td>
            <td>R$ ${product.preco.toFixed(2)}</td>
            <td>R$ ${totalValue}</td>
          `;
          
          document.getElementById('product-table-body').appendChild(row);
        });

        // Exibir mensagem de sucesso
        showMessage('Produtos carregados com sucesso!', 'success');

      } catch (error) {
        // Em caso de erro, exibir mensagem
        showMessage('Erro ao carregar os produtos. Tente novamente mais tarde.', 'danger');
      }
    }

    // Função para exibir mensagens de sucesso ou erro
    function showMessage(message, type) {
      const messageElement = document.getElementById('message');
      messageElement.classList.remove('alert-success', 'alert-danger');
      messageElement.classList.add(`alert-${type}`);
      messageElement.textContent = message;
      messageElement.style.display = 'block';
    }

    // Chamar a função para carregar os produtos ao carregar a página
    window.onload = fetchProducts;
  </script>
</body>
</html>
